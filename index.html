<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f172a" />
<title>AG GROUP · Transakcije</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%2338bdf8' font-family='Arial' font-weight='bold'%3E€%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-2: #475569;
    --ink-3: #94a3b8;
    --line: #e2e8f0;
    --navy: #0f172a;
    --navy-2: #1e293b;
    --blue: #2563eb;
    --blue-soft: #eff6ff;
    --green: #059669;
    --green-soft: #ecfdf5;
    --red: #dc2626;
    --red-soft: #fef2f2;
    --amber: #d97706;
    --amber-soft: #fffbeb;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(15,23,42,.08), 0 4px 14px rgba(15,23,42,.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: .95rem; }

  /* ============ LOGIN ============ */
  #login-screen {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #0f172a 0%, #1e3a5f 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }

  .login-card {
    background: var(--card);
    border-radius: 20px;
    padding: 38px 32px;
    width: 100%; max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    text-align: center;
  }

  .login-logo {
    width: 64px; height: 64px;
    background: var(--navy);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; color: #38bdf8; font-weight: 800;
    margin: 0 auto 18px;
  }

  .login-card h1 { font-size: 1.25rem; font-weight: 700; }
  .login-card .sub { color: var(--ink-3); font-size: .86rem; margin: 6px 0 24px; }

  #pin-input {
    width: 100%;
    padding: 14px;
    font-size: 1.5rem;
    letter-spacing: .5em;
    text-align: center;
    border: 2px solid var(--line);
    border-radius: 12px;
    outline: none;
  }
  #pin-input:focus { border-color: var(--blue); }

  .btn-login {
    width: 100%; margin-top: 14px; padding: 13px;
    background: var(--navy); color: white;
    border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 600;
    transition: background .2s;
  }
  .btn-login:hover { background: var(--navy-2); }

  #login-error { color: var(--red); font-size: .85rem; margin-top: 12px; min-height: 1.2em; }

  /* ============ HEADER ============ */
  header {
    background: var(--navy);
    color: white;
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
  }

  .header-inner {
    max-width: 1060px; margin: 0 auto;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
  }

  .logo-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(56,189,248,.15);
    color: #38bdf8; font-weight: 800; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .brand { line-height: 1.15; }
  .brand b { font-size: 1rem; font-weight: 700; display: block; }
  .brand span { font-size: .72rem; color: #94a3b8; letter-spacing: .06em; text-transform: uppercase; }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .user-chip {
    display: flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,.08);
    padding: 6px 12px; border-radius: 20px;
    font-size: .85rem; font-weight: 600;
  }
  .user-dot { width: 9px; height: 9px; border-radius: 50%; }
  .user-dot.Aleksandar { background: #38bdf8; }
  .user-dot.Daniel { background: #fbbf24; }

  .btn-logout {
    background: none; border: 1px solid rgba(255,255,255,.2);
    color: #cbd5e1; border-radius: 9px;
    padding: 6px 12px; font-size: .8rem;
    transition: background .2s;
  }
  .btn-logout:hover { background: rgba(255,255,255,.1); }

  /* ============ LAYOUT ============ */
  .container { max-width: 1060px; margin: 0 auto; padding: 22px 16px 60px; }

  /* ============ SALDO HERO ============ */
  .hero {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    border-radius: var(--radius);
    color: white;
    padding: 24px 26px;
    margin-bottom: 16px;
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px;
    box-shadow: var(--shadow);
  }

  .hero .label { font-size: .78rem; color: #94a3b8; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  .hero .saldo { font-size: 2.3rem; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
  .hero .saldo.neg { color: #f87171; }
  .hero .saldo.poz { color: #4ade80; }
  .hero .saldo-rsd { font-size: .85rem; color: #94a3b8; margin-top: 2px; }

  .hero-side { margin-left: auto; text-align: right; font-size: .82rem; color: #cbd5e1; }
  .hero-side .kurs-row { display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
  .hero-side input {
    width: 78px; padding: 5px 8px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.08); color: white;
    font-weight: 600; font-size: .85rem; outline: none; text-align: right;
  }
  .hero-side input:focus { border-color: #38bdf8; }
  .hero-side .pocetno { margin-top: 8px; color: #64748b; font-size: .75rem; }

  /* ============ SUMMARY CARDS ============ */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }

  .scard {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    border-top: 3px solid var(--line);
  }
  .scard.green { border-top-color: var(--green); }
  .scard.red { border-top-color: var(--red); }
  .scard.amber { border-top-color: var(--amber); }
  .scard.blue { border-top-color: var(--blue); }

  .scard .t { font-size: .74rem; font-weight: 700; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; }
  .scard .v { font-size: 1.3rem; font-weight: 800; margin-top: 5px; }
  .scard .s { font-size: .74rem; color: var(--ink-3); margin-top: 3px; }
  .scard.green .v { color: var(--green); }
  .scard.red .v { color: var(--red); }
  .scard.amber .v { color: var(--amber); }
  .scard.blue .v { color: var(--blue); }

  /* ============ TABS ============ */
  .tabs {
    display: flex; gap: 6px;
    background: #e2e8f0;
    border-radius: 12px;
    padding: 5px;
    margin-bottom: 18px;
    width: fit-content;
  }

  .tabs button {
    border: none; background: none;
    padding: 9px 22px;
    border-radius: 9px;
    font-size: .92rem; font-weight: 600;
    color: var(--ink-2);
    transition: background .2s, color .2s;
  }
  .tabs button.active { background: var(--navy); color: white; box-shadow: 0 2px 6px rgba(15,23,42,.25); }

  /* ============ FORM CARD ============ */
  .form-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  .form-card h2 { font-size: .95rem; font-weight: 700; margin-bottom: 14px; color: var(--ink); display: flex; align-items: center; gap: 8px; }

  .type-toggle { display: flex; border-radius: 10px; overflow: hidden; border: 2px solid var(--line); margin-bottom: 14px; }
  .type-toggle button { flex: 1; padding: 10px; border: none; background: white; font-size: .92rem; font-weight: 600; color: var(--ink-2); transition: all .15s; }
  .type-toggle button.on-red { background: var(--red); color: white; }
  .type-toggle button.on-green { background: var(--green); color: white; }
  .type-toggle button.on-amber { background: var(--amber); color: white; }
  .type-toggle button.on-blue { background: var(--blue); color: white; }

  .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .fg { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
  .fg label { font-size: .76rem; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
  .fg input, .fg select, .fg textarea {
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s;
    background: white;
  }
  .fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--blue); }
  .fg textarea { resize: vertical; min-height: 44px; }

  .iznos-wrap { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; transition: border-color .15s; }
  .iznos-wrap:focus-within { border-color: var(--blue); }
  .iznos-wrap input { border: none; border-radius: 0; flex: 1; min-width: 70px; outline: none; padding: 10px 12px; }
  .valuta-toggle { display: flex; border-left: 1.5px solid var(--line); flex-shrink: 0; }
  .valuta-toggle button { padding: 0 13px; border: none; background: #f8fafc; font-size: .8rem; font-weight: 800; color: var(--ink-3); transition: all .15s; }
  .valuta-toggle button:first-child { border-right: 1px solid var(--line); }
  .valuta-toggle button.on { background: var(--navy); color: white; }

  .btn-primary {
    width: 100%; padding: 12px;
    background: var(--navy); color: white;
    border: none; border-radius: 10px;
    font-size: .98rem; font-weight: 700;
    transition: background .2s;
  }
  .btn-primary:hover { background: var(--navy-2); }

  .btn-cancel-edit {
    width: 100%; margin-top: 8px; padding: 9px;
    background: none; border: 1.5px solid var(--line);
    border-radius: 10px; color: var(--ink-2); font-size: .85rem; font-weight: 600;
  }

  /* ============ FILTER ============ */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .filter-bar select, .filter-bar input {
    padding: 8px 11px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-size: .85rem;
    outline: none;
    background: white;
  }
  .filter-bar input[type="search"] { flex: 1; min-width: 130px; }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--blue); }

  /* ============ LIST ============ */
  .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .list-header h2 { font-size: .95rem; font-weight: 700; color: var(--ink-2); }
  .btn-export { padding: 7px 14px; background: white; color: var(--ink-2); border: 1.5px solid var(--line); border-radius: 9px; font-size: .8rem; font-weight: 700; }
  .btn-export:hover { border-color: var(--ink-3); }

  .empty { text-align: center; padding: 44px 20px; color: var(--ink-3); background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
  .empty .ic { font-size: 2.2rem; margin-bottom: 8px; }

  .titem {
    background: var(--card);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 9px;
    box-shadow: var(--shadow);
    display: flex; gap: 12px; align-items: flex-start;
    border-left: 4px solid var(--line);
  }
  .titem.trosak { border-left-color: var(--red); }
  .titem.priliv { border-left-color: var(--green); }
  .titem.dugujemo { border-left-color: var(--amber); }
  .titem.nama_duguju { border-left-color: var(--blue); }
  .titem.izmiren { opacity: .5; }

  .tbody { flex: 1; min-width: 0; }
  .ttop { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .topis { font-weight: 600; font-size: .95rem; word-break: break-word; }
  .tamount { font-size: 1.08rem; font-weight: 800; white-space: nowrap; }
  .tamount.minus { color: var(--red); }
  .tamount.plus { color: var(--green); }
  .tamount-sub { font-size: .72rem; color: var(--ink-3); text-align: right; white-space: nowrap; }

  .tmeta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .mtag { font-size: .73rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: 3px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: .7rem; font-weight: 700; }
  .badge.kat { background: var(--blue-soft); color: var(--blue); }
  .badge.Aleksandar { background: #e0f2fe; color: #0369a1; }
  .badge.Daniel { background: #fef3c7; color: #b45309; }
  .badge.aktivan { background: var(--amber-soft); color: var(--amber); }
  .badge.izmiren-b { background: var(--green-soft); color: var(--green); }

  .tactions { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; align-items: flex-end; }
  .btn-mini {
    padding: 4px 10px;
    border: 1.5px solid var(--line);
    background: white; color: var(--ink-2);
    border-radius: 7px; font-size: .73rem; font-weight: 700;
    white-space: nowrap;
    transition: all .15s;
  }
  .btn-mini:hover { border-color: var(--ink-3); }
  .btn-mini.green { border-color: var(--green); color: var(--green); }
  .btn-mini.green:hover { background: var(--green); color: white; }
  .btn-mini.del:hover { border-color: var(--red); color: var(--red); }

  /* ============ TOAST ============ */
  .toast {
    position: fixed; bottom: 22px; left: 50%;
    transform: translate(-50%, 90px);
    background: var(--navy); color: white;
    padding: 12px 22px; border-radius: 12px;
    font-size: .9rem; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
    opacity: 0; transition: all .3s; z-index: 200;
    max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.err { background: var(--red); }

  .loading-bar { text-align: center; padding: 40px; color: var(--ink-3); font-size: .9rem; }

  @media (max-width: 560px) {
    .hero .saldo { font-size: 1.8rem; }
    .hero-side { margin-left: 0; text-align: left; width: 100%; }
    .hero-side .kurs-row { justify-content: flex-start; }
    .tabs { width: 100%; }
    .tabs button { flex: 1; padding: 9px 8px; }
    .brand span { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">€</div>
    <h1>AG GROUP · Transakcije</h1>
    <div class="sub">Unesite svoj PIN za pristup</div>
    <input type="password" id="pin-input" inputmode="numeric" autocomplete="off" placeholder="••••" maxlength="8"
           onkeydown="if(event.key==='Enter')login()" />
    <button class="btn-login" onclick="login()">Prijavi se</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <header>
    <div class="header-inner">
      <div class="logo-mark">€</div>
      <div class="brand"><b>Transakcije</b><span>AG GROUP · zajednička evidencija</span></div>
      <div class="header-right">
        <div class="user-chip"><span class="user-dot" id="user-dot"></span><span id="user-name"></span></div>
        <button class="btn-logout" onclick="logout()">Odjava</button>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- SALDO -->
    <div class="hero">
      <div>
        <div class="label">Trenutno stanje</div>
        <div class="saldo" id="saldo">—</div>
        <div class="saldo-rsd" id="saldo-rsd"></div>
      </div>
      <div class="hero-side">
        <div class="kurs-row">
          <span>Kurs: 1 € =</span>
          <input type="number" id="kurs" step="0.01" min="1" onchange="setKurs()" />
          <span>RSD</span>
        </div>
        <div class="pocetno" id="pocetno-info"></div>
      </div>
    </div>

    <!-- SUMMARY -->
    <div class="summary">
      <div class="scard green"><div class="t">Prilivi ukupno</div><div class="v" id="sum-priliv">—</div><div class="s" id="sum-priliv-m"></div></div>
      <div class="scard red"><div class="t">Troškovi ukupno</div><div class="v" id="sum-trosak">—</div><div class="s" id="sum-trosak-m"></div></div>
      <div class="scard amber"><div class="t">Mi dugujemo</div><div class="v" id="sum-dugujemo">—</div><div class="s" id="sum-dugujemo-s"></div></div>
      <div class="scard blue"><div class="t">Nama duguju</div><div class="v" id="sum-namaduguju">—</div><div class="s" id="sum-namaduguju-s"></div></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button id="tab-trans" class="active" onclick="setTab('trans')">💳 Transakcije</button>
      <button id="tab-dugovi" onclick="setTab('dugovi')">🤝 Dugovi</button>
    </div>

    <!-- ===== TAB: TRANSAKCIJE ===== -->
    <div id="view-trans">
      <div class="form-card">
        <h2 id="trans-form-title">➕ Nova transakcija</h2>
        <div class="type-toggle">
          <button id="bt-trosak" class="on-red" onclick="setTip('trosak')">⬆ Trošak / Plaćanje</button>
          <button id="bt-priliv" onclick="setTip('priliv')">⬇ Priliv / Naplata</button>
        </div>
        <div class="form-row">
          <div class="fg" style="flex:2; min-width:200px;">
            <label>Opis</label>
            <textarea id="t-opis" placeholder="Šta je plaćeno / od koga je naplaćeno..."></textarea>
          </div>
          <div class="fg">
            <label>Iznos</label>
            <div class="iznos-wrap">
              <input type="number" id="t-iznos" placeholder="0.00" min="0" step="0.01" />
              <div class="valuta-toggle">
                <button id="bv-rsd" class="on" onclick="setValuta('RSD')">RSD</button>
                <button id="bv-eur" onclick="setValuta('EUR')">EUR</button>
              </div>
            </div>
          </div>
          <div class="fg">
            <label>Kategorija</label>
            <select id="t-kategorija"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="fg"><label>Datum i vreme</label><input type="datetime-local" id="t-datum" /></div>
          <div class="fg"><label>Napomena (opciono)</label><input type="text" id="t-napomena" placeholder="Dodatna napomena..." /></div>
        </div>
        <button class="btn-primary" id="btn-save-trans" onclick="saveTrans()">Sačuvaj transakciju</button>
        <button class="btn-cancel-edit" id="btn-cancel-edit" style="display:none;" onclick="cancelEdit()">Otkaži izmenu</button>
      </div>

      <div class="filter-bar">
        <select id="f-tip" onchange="renderTrans()">
          <option value="sve">Svi tipovi</option>
          <option value="trosak">Troškovi</option>
          <option value="priliv">Prilivi</option>
        </select>
        <select id="f-osoba" onchange="renderTrans()">
          <option value="sve">Obojica</option>
          <option value="Aleksandar">Aleksandar</option>
          <option value="Daniel">Daniel</option>
        </select>
        <select id="f-kategorija" onchange="renderTrans()"><option value="sve">Sve kategorije</option></select>
        <select id="f-mesec" onchange="renderTrans()"><option value="sve">Svi meseci</option></select>
        <input type="search" id="f-pretraga" placeholder="🔍 Pretraga..." oninput="renderTrans()" />
      </div>

      <div class="list-header">
        <h2 id="trans-title">Transakcije</h2>
        <button class="btn-export" onclick="exportTransCSV()">⬇ Izvezi CSV</button>
      </div>
      <div id="lista-trans" class="loading-bar">Učitavanje...</div>
    </div>

    <!-- ===== TAB: DUGOVI ===== -->
    <div id="view-dugovi" style="display:none;">
      <div class="form-card">
        <h2>➕ Novi dug</h2>
        <div class="type-toggle">
          <button id="bd-dugujemo" class="on-amber" onclick="setDugTip('dugujemo')">⬆ Mi dugujemo</button>
          <button id="bd-namaduguju" onclick="setDugTip('nama_duguju')">⬇ Nama duguju</button>
        </div>
        <div class="form-row">
          <div class="fg"><label id="d-kome-label">Kome dugujemo</label><input type="text" id="d-kome" placeholder="Ime / firma..." /></div>
          <div class="fg">
            <label>Iznos</label>
            <div class="iznos-wrap">
              <input type="number" id="d-iznos" placeholder="0.00" min="0" step="0.01" />
              <div class="valuta-toggle">
                <button id="bdv-rsd" onclick="setDugValuta('RSD')">RSD</button>
                <button id="bdv-eur" class="on" onclick="setDugValuta('EUR')">EUR</button>
              </div>
            </div>
          </div>
          <div class="fg"><label>Datum</label><input type="date" id="d-datum" /></div>
        </div>
        <div class="form-row">
          <div class="fg" style="flex:2;"><label>Za šta / osnov</label><input type="text" id="d-opis" placeholder="Materijal, pozajmica, usluga..." /></div>
          <div class="fg"><label>Napomena (opciono)</label><input type="text" id="d-napomena" placeholder="Rok, dogovor..." /></div>
        </div>
        <button class="btn-primary" onclick="saveDug()">Sačuvaj dug</button>
      </div>

      <div class="filter-bar">
        <select id="fd-tip" onchange="renderDugovi()">
          <option value="sve">Svi dugovi</option>
          <option value="dugujemo">Mi dugujemo</option>
          <option value="nama_duguju">Nama duguju</option>
        </select>
        <select id="fd-status" onchange="renderDugovi()">
          <option value="aktivan">Aktivni</option>
          <option value="izmiren">Izmireni</option>
          <option value="sve">Svi</option>
        </select>
        <input type="search" id="fd-pretraga" placeholder="🔍 Pretraga..." oninput="renderDugovi()" />
      </div>

      <div class="list-header">
        <h2 id="dugovi-title">Dugovi</h2>
        <button class="btn-export" onclick="exportDugoviCSV()">⬇ Izvezi CSV</button>
      </div>
      <div id="lista-dugovi" class="loading-bar">Učitavanje...</div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'api/api.php';
const KATEGORIJE = ['Materijal','Gorivo i vozila','Plate i dnevnice','Montaža','Alat i oprema','Kancelarija','Porezi i doprinosi','Pozajmica','Vraćanje duga','Privatno','Ostalo'];

let DATA = { transakcije: [], dugovi: [], podesavanja: {} };
let USER = null;
let tip = 'trosak', valuta = 'RSD';
let dugTip = 'dugujemo', dugValuta = 'EUR';
let editId = null;

// ---------- API ----------
async function api(action, payload = {}) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...payload })
  });
  const d = await r.json().catch(() => ({ error: 'Greška u komunikaciji sa serverom.' }));
  if (!r.ok) {
    if (r.status === 401 && action !== 'login' && action !== 'me') showLogin();
    throw new Error(d.error || 'Greška servera.');
  }
  return d;
}

// ---------- AUTH ----------
async function login() {
  const pin = document.getElementById('pin-input').value.trim();
  const err = document.getElementById('login-error');
  err.textContent = '';
  if (!pin) { err.textContent = 'Unesite PIN.'; return; }
  try {
    const d = await api('login', { pin });
    USER = d.user;
    document.getElementById('pin-input').value = '';
    showApp();
    await loadData();
  } catch (e) { err.textContent = e.message; }
}

async function logout() {
  try { await api('logout'); } catch (e) {}
  USER = null;
  showLogin();
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  setTimeout(() => document.getElementById('pin-input').focus(), 100);
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-name').textContent = USER;
  document.getElementById('user-dot').className = 'user-dot ' + USER;
}

// ---------- HELPERS ----------
function getKurs() { return parseFloat(DATA.podesavanja.kurs) || 117.2; }
function getPocetno() { return parseFloat(DATA.podesavanja.pocetno_stanje_eur) || 0; }
function toEUR(iznos, v) { return v === 'EUR' ? iznos : iznos / getKurs(); }

function fmt(n, suffix) {
  return n.toLocaleString('sr-RS', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + suffix;
}
function fmtEUR(n) { return fmt(n, ' €'); }
function fmtRSD(n) { return fmt(n, ' RSD'); }
function fmtIznos(iznos, v) { return v === 'EUR' ? fmtEUR(iznos) : fmtRSD(iznos); }

function fmtDatum(s) {
  const d = new Date(String(s).replace(' ', 'T'));
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDatumKratko(s) {
  const d = new Date(String(s).replace(' ', 'T'));
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
}

function sada() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function danas() { return sada().slice(0, 10); }

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2800);
}

// ---------- DATA ----------
async function loadData() {
  try {
    DATA = await api('data');
    document.getElementById('kurs').value = getKurs();
    document.getElementById('pocetno-info').textContent = 'Početno stanje: ' + fmtEUR(getPocetno());
    buildMesecFilter();
    renderAll();
  } catch (e) { showToast(e.message, true); }
}

function renderAll() { renderSummary(); renderTrans(); renderDugovi(); }

async function setKurs() {
  const v = document.getElementById('kurs').value;
  if (!v || parseFloat(v) <= 0) return;
  try {
    await api('set_podesavanje', { kljuc: 'kurs', vrednost: v });
    DATA.podesavanja.kurs = v;
    renderAll();
    showToast('Kurs ažuriran.');
  } catch (e) { showToast(e.message, true); }
}

// ---------- SUMMARY ----------
function renderSummary() {
  const mesecSada = new Date().toISOString().slice(0, 7);
  let priliv = 0, trosak = 0, prilivM = 0, trosakM = 0;

  for (const t of DATA.transakcije) {
    const eur = toEUR(parseFloat(t.iznos), t.valuta);
    const m = String(t.datum).slice(0, 7);
    if (t.tip === 'priliv') { priliv += eur; if (m === mesecSada) prilivM += eur; }
    else { trosak += eur; if (m === mesecSada) trosakM += eur; }
  }

  const saldo = getPocetno() + priliv - trosak;
  const elS = document.getElementById('saldo');
  elS.textContent = fmtEUR(saldo);
  elS.className = 'saldo ' + (saldo < 0 ? 'neg' : 'poz');
  document.getElementById('saldo-rsd').textContent = '≈ ' + fmtRSD(saldo * getKurs());

  document.getElementById('sum-priliv').textContent = fmtEUR(priliv);
  document.getElementById('sum-priliv-m').textContent = 'Ovaj mesec: ' + fmtEUR(prilivM);
  document.getElementById('sum-trosak').textContent = fmtEUR(trosak);
  document.getElementById('sum-trosak-m').textContent = 'Ovaj mesec: ' + fmtEUR(trosakM);

  const aktivni = DATA.dugovi.filter(d => d.status === 'aktivan');
  const dugujemo = aktivni.filter(d => d.tip === 'dugujemo');
  const namaDuguju = aktivni.filter(d => d.tip === 'nama_duguju');
  const sumD = dugujemo.reduce((s, d) => s + toEUR(parseFloat(d.iznos), d.valuta), 0);
  const sumN = namaDuguju.reduce((s, d) => s + toEUR(parseFloat(d.iznos), d.valuta), 0);

  document.getElementById('sum-dugujemo').textContent = fmtEUR(sumD);
  document.getElementById('sum-dugujemo-s').textContent = dugujemo.length + ' aktivnih';
  document.getElementById('sum-namaduguju').textContent = fmtEUR(sumN);
  document.getElementById('sum-namaduguju-s').textContent = namaDuguju.length + ' aktivnih';
}

// ---------- TABS ----------
function setTab(t) {
  document.getElementById('tab-trans').className = t === 'trans' ? 'active' : '';
  document.getElementById('tab-dugovi').className = t === 'dugovi' ? 'active' : '';
  document.getElementById('view-trans').style.display = t === 'trans' ? 'block' : 'none';
  document.getElementById('view-dugovi').style.display = t === 'dugovi' ? 'block' : 'none';
}

// ---------- TRANSAKCIJE ----------
function setTip(t) {
  tip = t;
  document.getElementById('bt-trosak').className = t === 'trosak' ? 'on-red' : '';
  document.getElementById('bt-priliv').className = t === 'priliv' ? 'on-green' : '';
}
function setValuta(v) {
  valuta = v;
  document.getElementById('bv-rsd').className = v === 'RSD' ? 'on' : '';
  document.getElementById('bv-eur').className = v === 'EUR' ? 'on' : '';
}

async function saveTrans() {
  const payload = {
    tip,
    opis: document.getElementById('t-opis').value.trim(),
    iznos: parseFloat(document.getElementById('t-iznos').value),
    valuta,
    kategorija: document.getElementById('t-kategorija').value,
    datum: document.getElementById('t-datum').value,
    napomena: document.getElementById('t-napomena').value.trim()
  };
  if (!payload.opis) { showToast('Unesite opis.', true); return; }
  if (!payload.iznos || payload.iznos <= 0) { showToast('Unesite ispravan iznos.', true); return; }
  if (!payload.datum) { showToast('Unesite datum.', true); return; }

  try {
    if (editId) {
      await api('update_trans', { id: editId, ...payload });
      showToast('Transakcija izmenjena.');
    } else {
      await api('add_trans', payload);
      showToast(tip === 'trosak' ? 'Trošak zabeležen.' : 'Priliv zabeležen.');
    }
    cancelEdit();
    clearTransForm();
    await loadData();
  } catch (e) { showToast(e.message, true); }
}

function clearTransForm() {
  document.getElementById('t-opis').value = '';
  document.getElementById('t-iznos').value = '';
  document.getElementById('t-napomena').value = '';
  document.getElementById('t-datum').value = sada();
}

function editTrans(id) {
  const t = DATA.transakcije.find(x => x.id == id);
  if (!t) return;
  editId = id;
  setTip(t.tip);
  setValuta(t.valuta);
  document.getElementById('t-opis').value = t.opis;
  document.getElementById('t-iznos').value = t.iznos;
  document.getElementById('t-kategorija').value = KATEGORIJE.includes(t.kategorija) ? t.kategorija : 'Ostalo';
  document.getElementById('t-datum').value = String(t.datum).replace(' ', 'T').slice(0, 16);
  document.getElementById('t-napomena').value = t.napomena || '';
  document.getElementById('trans-form-title').textContent = '✏️ Izmena transakcije';
  document.getElementById('btn-save-trans').textContent = 'Sačuvaj izmene';
  document.getElementById('btn-cancel-edit').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editId = null;
  document.getElementById('trans-form-title').textContent = '➕ Nova transakcija';
  document.getElementById('btn-save-trans').textContent = 'Sačuvaj transakciju';
  document.getElementById('btn-cancel-edit').style.display = 'none';
}

async function delTrans(id) {
  if (!confirm('Obrisati ovu transakciju?')) return;
  try {
    await api('del_trans', { id });
    showToast('Transakcija obrisana.');
    await loadData();
  } catch (e) { showToast(e.message, true); }
}

function buildMesecFilter() {
  const meseci = [...new Set(DATA.transakcije.map(t => String(t.datum).slice(0, 7)))].sort().reverse();
  const sel = document.getElementById('f-mesec');
  const cur = sel.value;
  const NAZIVI = ['januar','februar','mart','april','maj','jun','jul','avgust','septembar','oktobar','novembar','decembar'];
  sel.innerHTML = '<option value="sve">Svi meseci</option>' + meseci.map(m => {
    const [g, mm] = m.split('-');
    return `<option value="${m}">${NAZIVI[parseInt(mm)-1]} ${g}</option>`;
  }).join('');
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

function filteredTrans() {
  const fTip = document.getElementById('f-tip').value;
  const fOsoba = document.getElementById('f-osoba').value;
  const fKat = document.getElementById('f-kategorija').value;
  const fMesec = document.getElementById('f-mesec').value;
  const q = document.getElementById('f-pretraga').value.toLowerCase().trim();

  return DATA.transakcije.filter(t => {
    if (fTip !== 'sve' && t.tip !== fTip) return false;
    if (fOsoba !== 'sve' && t.uneo !== fOsoba) return false;
    if (fKat !== 'sve' && t.kategorija !== fKat) return false;
    if (fMesec !== 'sve' && String(t.datum).slice(0, 7) !== fMesec) return false;
    if (q && !(t.opis + ' ' + (t.napomena || '')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderTrans() {
  const lista = document.getElementById('lista-trans');
  const items = filteredTrans();
  document.getElementById('trans-title').textContent = `Transakcije (${items.length})`;

  if (!items.length) {
    lista.className = '';
    lista.innerHTML = '<div class="empty"><div class="ic">📋</div>Nema transakcija za prikaz.</div>';
    return;
  }

  lista.className = '';
  lista.innerHTML = items.map(t => {
    const iznos = parseFloat(t.iznos);
    const sign = t.tip === 'trosak' ? '−' : '+';
    const cls = t.tip === 'trosak' ? 'minus' : 'plus';
    const sub = t.valuta === 'RSD' ? '≈ ' + fmtEUR(toEUR(iznos, 'RSD')) : '≈ ' + fmtRSD(iznos * getKurs());
    return `
    <div class="titem ${t.tip}">
      <div class="tbody">
        <div class="ttop">
          <div class="topis">${esc(t.opis)}</div>
          <div>
            <div class="tamount ${cls}">${sign}${fmtIznos(iznos, t.valuta)}</div>
            <div class="tamount-sub">${sub}</div>
          </div>
        </div>
        <div class="tmeta">
          <span class="badge ${esc(t.uneo)}">${esc(t.uneo)}</span>
          <span class="badge kat">${esc(t.kategorija)}</span>
          <span class="mtag">🕐 ${fmtDatum(t.datum)}</span>
          ${t.napomena ? `<span class="mtag">📝 ${esc(t.napomena)}</span>` : ''}
        </div>
      </div>
      <div class="tactions">
        <button class="btn-mini" onclick="editTrans(${t.id})">✏️ Izmeni</button>
        <button class="btn-mini del" onclick="delTrans(${t.id})">✕ Obriši</button>
      </div>
    </div>`;
  }).join('');
}

function exportTransCSV() {
  const items = filteredTrans();
  if (!items.length) { showToast('Nema podataka za izvoz.', true); return; }
  const header = ['Datum','Tip','Opis','Iznos','Valuta','Iznos (EUR)','Kategorija','Uneo','Napomena'];
  const rows = items.map(t => [
    fmtDatum(t.datum),
    t.tip === 'trosak' ? 'Trošak' : 'Priliv',
    '"' + t.opis.replace(/"/g, '""') + '"',
    parseFloat(t.iznos).toFixed(2),
    t.valuta,
    toEUR(parseFloat(t.iznos), t.valuta).toFixed(2),
    t.kategorija,
    t.uneo,
    '"' + (t.napomena || '').replace(/"/g, '""') + '"'
  ]);
  downloadCSV([header, ...rows], 'transakcije');
}

// ---------- DUGOVI ----------
function setDugTip(t) {
  dugTip = t;
  document.getElementById('bd-dugujemo').className = t === 'dugujemo' ? 'on-amber' : '';
  document.getElementById('bd-namaduguju').className = t === 'nama_duguju' ? 'on-blue' : '';
  document.getElementById('d-kome-label').textContent = t === 'dugujemo' ? 'Kome dugujemo' : 'Ko nama duguje';
}
function setDugValuta(v) {
  dugValuta = v;
  document.getElementById('bdv-rsd').className = v === 'RSD' ? 'on' : '';
  document.getElementById('bdv-eur').className = v === 'EUR' ? 'on' : '';
}

async function saveDug() {
  const payload = {
    tip: dugTip,
    kome: document.getElementById('d-kome').value.trim(),
    iznos: parseFloat(document.getElementById('d-iznos').value),
    valuta: dugValuta,
    datum: document.getElementById('d-datum').value || danas(),
    opis: document.getElementById('d-opis').value.trim(),
    napomena: document.getElementById('d-napomena').value.trim()
  };
  if (!payload.kome) { showToast('Unesite ime.', true); return; }
  if (!payload.iznos || payload.iznos <= 0) { showToast('Unesite ispravan iznos.', true); return; }

  try {
    await api('add_dug', payload);
    showToast('Dug zabeležen.');
    document.getElementById('d-kome').value = '';
    document.getElementById('d-iznos').value = '';
    document.getElementById('d-opis').value = '';
    document.getElementById('d-napomena').value = '';
    document.getElementById('d-datum').value = danas();
    await loadData();
  } catch (e) { showToast(e.message, true); }
}

async function toggleDug(id) {
  try {
    await api('toggle_dug', { id });
    await loadData();
    showToast('Status duga promenjen.');
  } catch (e) { showToast(e.message, true); }
}

async function delDug(id) {
  if (!confirm('Obrisati ovaj dug?')) return;
  try {
    await api('del_dug', { id });
    showToast('Dug obrisan.');
    await loadData();
  } catch (e) { showToast(e.message, true); }
}

function filteredDugovi() {
  const fTip = document.getElementById('fd-tip').value;
  const fStatus = document.getElementById('fd-status').value;
  const q = document.getElementById('fd-pretraga').value.toLowerCase().trim();

  return DATA.dugovi.filter(d => {
    if (fTip !== 'sve' && d.tip !== fTip) return false;
    if (fStatus !== 'sve' && d.status !== fStatus) return false;
    if (q && !(d.kome + ' ' + d.opis + ' ' + (d.napomena || '')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderDugovi() {
  const lista = document.getElementById('lista-dugovi');
  const items = filteredDugovi();
  document.getElementById('dugovi-title').textContent = `Dugovi (${items.length})`;

  if (!items.length) {
    lista.className = '';
    lista.innerHTML = '<div class="empty"><div class="ic">🤝</div>Nema dugova za prikaz.</div>';
    return;
  }

  lista.className = '';
  lista.innerHTML = items.map(d => {
    const iznos = parseFloat(d.iznos);
    const sub = d.valuta === 'RSD' ? '≈ ' + fmtEUR(toEUR(iznos, 'RSD')) : '≈ ' + fmtRSD(iznos * getKurs());
    const smer = d.tip === 'dugujemo' ? '⬆ Dugujemo' : '⬇ Duguju nam';
    return `
    <div class="titem ${d.tip} ${d.status === 'izmiren' ? 'izmiren' : ''}">
      <div class="tbody">
        <div class="ttop">
          <div class="topis">${esc(d.kome)}${d.opis ? ' — ' + esc(d.opis) : ''}</div>
          <div>
            <div class="tamount ${d.tip === 'dugujemo' ? 'minus' : 'plus'}">${fmtIznos(iznos, d.valuta)}</div>
            <div class="tamount-sub">${sub}</div>
          </div>
        </div>
        <div class="tmeta">
          <span class="badge ${d.status === 'aktivan' ? 'aktivan' : 'izmiren-b'}">${d.status === 'aktivan' ? '⏳ Aktivan' : '✓ Izmiren'}</span>
          <span class="mtag">${smer}</span>
          <span class="badge ${esc(d.uneo)}">${esc(d.uneo)}</span>
          <span class="mtag">🕐 ${fmtDatumKratko(d.datum)}</span>
          ${d.napomena ? `<span class="mtag">📝 ${esc(d.napomena)}</span>` : ''}
        </div>
      </div>
      <div class="tactions">
        <button class="btn-mini green" onclick="toggleDug(${d.id})">${d.status === 'aktivan' ? '✓ Izmiren' : '↩ Vrati'}</button>
        <button class="btn-mini del" onclick="delDug(${d.id})">✕ Obriši</button>
      </div>
    </div>`;
  }).join('');
}

function exportDugoviCSV() {
  const items = filteredDugovi();
  if (!items.length) { showToast('Nema podataka za izvoz.', true); return; }
  const header = ['Datum','Tip','Kome/Ko','Osnov','Iznos','Valuta','Iznos (EUR)','Status','Uneo','Napomena'];
  const rows = items.map(d => [
    fmtDatumKratko(d.datum),
    d.tip === 'dugujemo' ? 'Mi dugujemo' : 'Nama duguju',
    '"' + d.kome.replace(/"/g, '""') + '"',
    '"' + (d.opis || '').replace(/"/g, '""') + '"',
    parseFloat(d.iznos).toFixed(2),
    d.valuta,
    toEUR(parseFloat(d.iznos), d.valuta).toFixed(2),
    d.status === 'aktivan' ? 'Aktivan' : 'Izmiren',
    d.uneo,
    '"' + (d.napomena || '').replace(/"/g, '""') + '"'
  ]);
  downloadCSV([header, ...rows], 'dugovi');
}

// ---------- CSV ----------
function downloadCSV(rows, prefix) {
  const csv = rows.map(r => r.join(';')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${prefix}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- INIT ----------
function init() {
  const selKat = document.getElementById('t-kategorija');
  selKat.innerHTML = KATEGORIJE.map(k => `<option>${k}</option>`).join('');
  const selFKat = document.getElementById('f-kategorija');
  selFKat.innerHTML = '<option value="sve">Sve kategorije</option>' + KATEGORIJE.map(k => `<option>${k}</option>`).join('');
  document.getElementById('t-datum').value = sada();
  document.getElementById('d-datum').value = danas();

  api('me').then(d => {
    if (d.user) { USER = d.user; showApp(); loadData(); }
    else showLogin();
  }).catch(() => showLogin());
}

init();
</script>
</body>
</html>
